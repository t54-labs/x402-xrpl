apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-api
  namespace: x402-xrpl
  labels:
    app: x402-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: x402-api
  template:
    metadata:
      labels:
        app: x402-api
    spec:
      containers:
        - name: api
          image: us-west1-docker.pkg.dev/tworld-473700/x402-xrpl/api:latest
          ports:
            - containerPort: 4001
          envFrom:
            - secretRef:
                name: api-secrets
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: x402-api
  namespace: x402-xrpl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: x402-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
