version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: x402_xrpl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/x402_xrpl
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/x402_xrpl
      XRPL_WSS: wss://s.altnet.rippletest.net:51233
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
