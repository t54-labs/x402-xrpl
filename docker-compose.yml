version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: x402_xrpl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:4001
    depends_on:
      api:
        condition: service_started
    profiles:
      - full

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/x402_xrpl
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD for the full stack profile}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET for the full stack profile}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/x402_xrpl
      XRPL_WSS: wss://s.altnet.rippletest.net:51233
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
